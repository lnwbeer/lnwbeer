name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # อัปเดตทุกวัน 00:00 UTC (07:00 เวลาไทย)
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake2.svg
            dist/github-contribution-grid-snake2-dark.svg?palette=github-dark

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
